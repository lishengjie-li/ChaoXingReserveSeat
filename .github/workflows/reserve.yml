name: auto_Reserve

on:
  # 定时由外部 cron-job.org 调用 dispatch API 负责（北京 19:50）。
  # 不要在这里加 schedule —— 会和 cron-job.org 重复触发，导致一天跑两次。
  workflow_dispatch:
    inputs:
      profile:
        description: '拟人档位 (human=首击8.8s / fast=首击4.0s)'
        required: false
        default: 'human'
        type: choice
        options:
          - human
          - fast
      offset:
        description: '覆盖首击秒数 (留空则用 profile 默认值)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: pip

      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          # Ubuntu 24.04 正确包名：libgl1 替代废弃的 libgl1-mesa-glx
          # runner 无 GUI，用 opencv-python-headless 避免 libGL 缺失报错
          sudo apt-get update
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev libgl1 libglib2.0-0 -y
          pip install cryptography requests opencv-python-headless curl_cffi numpy

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          ARGS="-m reserve --action"
          if [ -n "${{ github.event.inputs.offset }}" ]; then
            ARGS="$ARGS --offset ${{ github.event.inputs.offset }}"
          elif [ -n "${{ github.event.inputs.profile }}" ]; then
            ARGS="$ARGS --profile ${{ github.event.inputs.profile }}"
          else
            ARGS="$ARGS --profile human"
          fi
          echo "run: python main.py $ARGS"
          python main.py $ARGS
